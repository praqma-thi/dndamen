<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/webp" href="{{ '/assets/fav.webp' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="topbar">
      <a class="topbar-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="topbar-adventures" aria-label="Adventure navigation">
        <details name="topbar-menus">
          <summary>Adventures</summary>
          <div class="topbar-dropdown-panel">
            {% for adventure in site.data.adventures %}
            <section class="adventure-nav-group">
              <a class="adventure-nav-name" href="{{ '/adventures/' | append: adventure.slug | append: '/' | relative_url }}">{{ adventure.name | escape }}</a>
              <ul class="adventure-nav-links">
                <li><a href="{{ '/adventures/' | append: adventure.slug | append: '/map/' | relative_url }}">Map</a></li>
                <li><a href="{{ '/adventures/' | append: adventure.slug | append: '/sessions/' | relative_url }}">Session logs</a></li>
                <li><a href="{{ '/adventures/' | append: adventure.slug | append: '/gallery/' | relative_url }}">Gallery</a></li>
              </ul>
            </section>
            {% endfor %}
          </div>
        </details>
      </nav>
      <nav class="topbar-database" aria-label="Database navigation">
        <details name="topbar-menus">
          <summary>Database</summary>
          <div class="topbar-dropdown-panel">
            <ul class="adventure-nav-links">
              <li><a href="{{ '/database/items/' | relative_url }}">Items</a></li>
            </ul>
          </div>
        </details>
      </nav>
      <nav class="topbar-links" aria-label="External links">
        <details name="topbar-menus">
          <summary>Links</summary>
          <div class="topbar-dropdown-panel">
            <ul class="adventure-nav-links">
              <li><a href="https://dnd5e.wikidot.com/">5e</a></li>
              <li><a href="https://dnd2024.wikidot.com/">2024e</a></li>
              <li><a href="https://dnd.rigo.nu/">Varlyn</a></li>
            </ul>
          </div>
        </details>
      </nav>
      <a class="topbar-github" href="https://github.com/praqma-thi/dndamen" aria-label="DnDamen on GitHub" referrerpolicy="no-referrer">
        <span class="visually-hidden">GitHub repository</span>
      </a>
    </header>
    <main class="content">
      {{ content }}
    </main>
  </body>
</html>

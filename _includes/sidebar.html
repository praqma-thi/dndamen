<aside class="sidebar">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}">Home</a>
    {% for adventure in site.data.adventures %}
      <section class="adventure-nav">
        <h2><a href="{{ '/adventures/' | append: adventure.slug | append: '/' | relative_url }}">{{ adventure.name }}</a></h2>
      </section>
    {% endfor %}
  </nav>
</aside>

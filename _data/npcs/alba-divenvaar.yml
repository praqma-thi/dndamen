description: >
  Alba Divenvaar is a perennial traveller ready to finally put down roots.
  Her lifelong dream is to behold the shores of Arcadia and discover the alchemical secrets of that land.
  Age has begun to get the best of her, so when she learned Andoran was establishing a new colony in the Arcadian Ocean, Alba applied for citizenship and won a spot among the second group of settlers.

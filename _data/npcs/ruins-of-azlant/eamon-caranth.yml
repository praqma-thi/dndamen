description: >
  Eamon feels called to steer Talmandor's Bounty away from merely a fiscal enterprise and toward becoming a community where families will flourish.
  He and Kurvis Nurpico bicker like an old married couple, but despite this, they are the best of friends.

  Eamon spends his time among the colonists tending to their spiritual needs, wounds and assuaging their worries.
  He has problems sleeping soundly, as quite a few nights are spent calming the tormented spirit of Sylas Weatherbee together with Kurvis.

description:
  Employed by the Bountiful Venture Company as a scholar and surveyor tasked with cataloguing natural resources and fresh water locations.
  Lyra has a penchant for danger yet somehow manages to stay out of it.

  Lyra spends more time in the wilderness than at the colony, mapping out surroundings and noting natural resources (or lack thereof).
  A quiet rivalry has sparked between Perrell and her, as she finds the historian's habit of redrawing Lyra's maps to be "up to standard" incredibly degrading.

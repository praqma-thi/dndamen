art:
  headshot: /assets/ruins-of-azlant/images/npcs/perrell-beys.png
  full: /assets/ruins-of-azlant/images/npcs/perrell-beys.png
status: alive
description:
  Employed as a historian by the Bountiful Venture Company, Perrell would have volunteered to join the colony out of academic interest even without the job.
  She chronicles daily events in Talmandor's Bounty, provides Ramona with scholarly advice on ruins and relics, and makes high-quality maps of the island for her employers.

  Perrell is rarely seen by the other colonists, spending a large amount of her time in a quiet nook of the government house.
  Many consider Perrel a workaholic, as they cannot tell the difference between her scribing colony journals or personal research notes.

description:
  A balding man with a bushy mustache meant to serve as an assistant blacksmith.
  While harmless enough, his overly masculine attitudes often rub people the wrong way.

  Rather than a blacksmith's apprentice, Luetin finds himself the sole blacksmith at Talmandor's Bounty.
  As such, his skills are in incredibly high demand, and his ego has ballooned immensely since arrival.

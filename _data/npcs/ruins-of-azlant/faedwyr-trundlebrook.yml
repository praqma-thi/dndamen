description: >
  While many would consider Faedwyr a simpleton, he lives by clear rules that make him a reliable friend.
  "When a friend asks for help, you help them", "Actions speak louder than words", and "Finish what you started" are just some of his grandfather's many mottos he adheres to.

  Despite his timid disposition, his reliability has made him rather popular among the other farmers, and was elected as a representative.
  When not hard at work in the fields, he is found organizing the farmers and discussing important matters with Ramona.

description:
  Medrinnah is resentful of her overbearing mother - Sighra - for bringing her along to Talmandor's Bounty.
  Forced to live in the middle of nowhere, and unlikely to ever see her friends again, Medrinnah's rebellious streak is rapidly escalating.

  She is apprenticing as a tailor under Jeanne who - emphatetic to the child's situation - keeps a very relaxed form of tutoring.

  Known to few - and not her mother - is Medrinnah's talent for lockpicking and inconspicious relocation of possessions.

description:
    Youngest adult son of the Carrolby family, wealthy horse breeders in Andoran.
    Harcourt receives a stipend from the family business, intending to join the colony, establish himself, hire workers to build stables, and import horses to the island at later date, thus expanding the family business to Ancorato and beyond.

status: alive
description: >
  The designated colony leader of Talmandor's Bounty.
  Ramona arrived on the Peregrine, expecting to assume leadership from Raylan Arkley, who would serve as her second-in-command.
  She has excellent leadership skills, and surprisingly fine bardic abilities; a fine singing voice and an appreciation for artistic talent.

  Ramona is either seen discussing and organizing work details with the colonists, pouring over planning documents in the government house, or helping with manual labour.
  The sight of her taking a moment to relax is exclusive to those close to her, such as Perell or the PCs, and rare even for them.

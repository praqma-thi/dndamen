  name: Ruins of Azlant
  logo: /assets/images/ruins-of-azlant.png
  description: >
    Thousands of years ago, a barrage of meteors rained down on Golarion, cutting short the remarkable human empire of Azlant while plunging the world into an era of darkness.
    Since then, the shattered continent of Azlant has lured intrepid explorers to its broken shores, but few have the mettle to survive in the remains of this dangerous and mysterious land.
    Now, a hopeful expedition has established a colony on one of the nearest islands across the sea, but danger has struck the fledgling settlement...

date: 2026-02-12
author: damen
entry: |
  - Party continues their climb
    - Everyone but Kaela guzzles up her entire supply of expensive healing potions
    - Party enters a rookery housing ravens; definitely non-magical ravens
    - Toranak crashes through the door into a mostly empty room with bell clockwork
    - A hidden ladder leads to the tower rooftops
  - Party encounters Xanesha
    - Diplomacy fails due to Xanesha being a silent illusion
    - Diplomacy no longer becomes an option when the real and hidden Xanesha starts stabbing party members
    - Combat ensues, notable events include:
      - Illusory demons flying toward the tower, splitting party attention
      - Dumbfuck wizard walking into melee range and getting her what's for
      - Noble paladin healing said dumbfuck wizard
      - Noble paladin dishing out godly amounts of damage
      - Xanesha climbing the tower's statue
      - Noble paladin attempts to topple the statue
      - Noble paladin mind controlled to flee
      - Noble cat familiar attempts to wake said paladin through clever use of claws
      - Noble paladin returning
      - Xanesha's ultimate defeat
  - Party interrogates Xanesha
    - Interrogating an arrogant, insane, regenerating creature capable of magic proves difficult
    - Interrogation deemed too dangerous and cut short through application of fire and steel
    - Other cultist cell uncovered in uncovered correspondence
  - Party delivers the head of Xanesha to Ironbriar and the Lord Mayor
    - Party awarded an absurd amount of coinage and a dedicated feast the following day

  - Kaela and Dimeon part ways with the party, leaving for Zirahill
  - Party is joined by Tiff, a ranger of modest size
  - Party is accompanied by Shalelu, an elven warrior and Sandpoint local
  - Toranak loredumps
  - Party disembarks and spends a night at Ilsurian before traveling North
  - Party encounters shoddy sign to Fort Rannick (fake), fooling only harebrained party members
    - Injured puma stuck in bear trap
    - Toranak engages in casual conversation
    - Rukus and Graul engage in casual combat
    - Fumblefest ensues
    - Toranak's pointy member
    - Party makes short work of the ogre and his dog, despite ALL THESE DEMONS SHOWING UP
  - Party continues on to "fort rannick"
    - party clears out ogres and giant spider through liberal use of backflips, frontflips, sideflips and the occasional regular run
    - toranak rabbit cannon

date: 2025-11-20
author: damen
entry: |
  - Toranak and the Kid go to investigate the house of the rising sun
    - Toranak smooth talks the way past the guards
    - Kid hears a non-sexual slap from the mansion
    - Kid starts a distracting fire, has to run from the guards
    - Toranak investigates warehouse crates
    - Kid rejoins
    - What follows is an elaborate stealth sequence full of brilliance, blunders and moral conundrums with the ultimate outcome that they come to the obvious conclusion that this is a giant nothing burger and they walk out with only minor property damage to their name.
  - Toranak and the Kid go scout the drop-off point for tomorrow's dark money deal
    - It's a big ass decrepit clocktower underneath the bridge
  - Toranak goes shopping and takes a damn good deal from a short king and his horse
  - Toranak and the Kid have a friendly sparring match to the death in Kaela's back yard to test Toranak's new purchase

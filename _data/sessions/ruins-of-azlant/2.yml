entry: |
  Session 2: The Gang Goes House-Looking

  Having vanquished the spooky ghost, the party seeks through the two remaining houses inside the palisade with much help from Subaya's guidance.
  Inside the first house, which seems to have belong to some kind of clergy, they find a lockbox of treasure, a wedding ring  with "Dearest Livvy" inscribed within, as well as marks from what seems to have been moved ale barrels.

  Inside the second house, the dwelling/office of the colony leader Rayland Arkley, they find an Azlanti pocket watch, the colony charter which lists the names of all the members of the colony whose names for the most part has some kind of mark next to them, as well as a letter that spoke of a leadership struggle in the colony as well as some kind of "fishing expedition" [my money's on ale smuggling].

  In the tents outside of the palisades Hangry found a fancy shirt.

  In the last house to the south by the well where the presumably barrel formed-trail lead Hangry choked the shit out of a drunken Choker [which I think had smashed and consumed one out of two smuggler's ale barrels] .

  A frog went down a well and a crab soon went spelunking the subterranean cavern it found connected to it.

  Satisfied with their investigation of the colony, the party decided to bunker down for the night in the big two story house inside the palisade before they made the trek back to report their finding to the ship. Seras' fizzy water did not fully satisfy Hangry.

  The party reached level 2.

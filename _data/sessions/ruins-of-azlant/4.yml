entry: |
  -- The Gang Goes Spelunking --

  Having freed the ship the party is asked if they're willing to serve as (Ramona's and) the colony's fixers.
  They accept.

  They're then tasked with exploring a cave presumably infested with Grimblewaffles.
  They make short work of the cavern-dwellers, including one bossy Brian.

  The following weeks are spent setting up the fresh start of the colony.

  A walk on the beach is interrupted by a pesky gremlin which leads to the find of a sunken canoe.

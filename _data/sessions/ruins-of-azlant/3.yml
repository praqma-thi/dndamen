date: 2026-11-14
author: tinidiablo
entry: |
  -- The Gang Goes Fishing --

  Venturing out from the colony before the crack of dawn the party come upon some holes in the ground just to the north of the colony.
  The subsequent light corpse-stealing bothers a new mother, who is quickly dispatched.

  After getting a bit off-track the party finds a roughly 10 feet broad "ant-track" [which might be some kind of trail for spybots to circle the colony, since it was found by the 1st wave of colonist to the east of the colony aswell --> something to certsinly investigate another day!]. The party follows the track back towards the coast which eventually takes them to a river crossing and improvised lumber camp where Rheia learn that some watery graverobbing might require a bit of the mage armour in order to safely get your hands on their Iouns.
  Following that lesson, Seras is quickly taught that leopards don't abide by social distancing.
  The leopard in turns gets taught that it too can become a tasty snack.

  Having made the track to the waiting ship the party informs Ramona of their findings, and in turn learn that the mood isn't so well onboard.
  By interacting with some colonists and shipcrew the party manages to put a damper on the mutinous tendencies, via Hangry choking the shit out of Seras and Rheia cleaning up Palacus' mess.
  Once the people on the boat are suitably convinced not to sail back to Almas the party investigates the lack of speedboating.
  The culprint turns out to be two echeneis (magical, speed-stealing fishes).
  Hangry jumps ship in order to spear them but ends up on the wrong end of a slow-chokehold.
  Realising that things aren't going too well [without even giving it the curteous nine minute wait!] the party jumps in after Hangry.
  The fishes are slain and the party gets back up on aboard the ship [presumably to sail back to Talmador's Bounty in order to make a second go at establishing the colony].
